
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil Toons Mania</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090d;color:white;font-family:Arial,sans-serif}
header{padding:20px 16px;background:#15151d;color:#e18aff;font-size:24px;font-weight:bold}
main{padding:16px;max-width:1000px;margin:auto}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#202027;color:white;font-size:16px}
h2{border-left:4px solid #d65bff;padding-left:10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#191922;border-radius:12px;overflow:hidden}
.poster{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:linear-gradient(140deg,#342050,#1b6c84);font-size:20px;font-weight:bold}
.card h3{padding:0 10px;font-size:16px}
button{margin:0 10px 14px;padding:10px 14px;background:#a83ee2;color:white;border:0;border-radius:8px}
footer{text-align:center;padding:20px;color:#aaa}
@media(min-width:650px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>▶ TAMIL TOONS MANIA</header>
<main>
<input id="search" placeholder="Search cartoons..." oninput="filterCards()">
<h2>🎬 Our Cartoons</h2>
<div class="cards" id="cards">
<div class="card" data-name="Chhota Bheem">

<div class="poster">
  <img
    src="./chhota-bheem.jpg"
    alt="Chhota Bheem"
    style="width:100%;height:100%;object-fit:cover;"
  >
</div>
 
<h3>Chhota Bheem</h3>
<button onclick="watch('Chhota Bheem')">▶ Watch</button>
</div>
<div class="card" data-name="Doraemon">

<div class="poster">
  <img src="./doraemon.jpg"
       alt="Doraemon"
       style="width:100%;height:100%;object-fit:cover;">
</div>
 
<h3>Doraemon</h3>
<button onclick="watch('Doraemon')">▶ Watch</button>
</div>
<div class="card" data-name="Jackie Chan">

<div class="poster">
  <img src="./jackie-chan.jpg"
       alt="Jackie Chan"
       style="width:100%;height:100%;object-fit:cover;">
</div>
<h3>Jackie Chan</h3>
<button onclick="watch('Jackie Chan')">▶ Watch</button>
</div>
<div class="card" data-name="Little singham">

<div class="poster">
  <img src="./little-singham.jpg"
       alt="Little Singham"
       style="width:100%;height:100%;object-fit:cover;">
</div>
<h3>Little Singham</h3>
<button onclick="watch('Little singham')">▶ Watch</button>
</div>
</div>
<p id="message"></p>
</main>
<footer>Tamil Toons Mania</footer>
<script>
function filterCards(){
 const q=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.card').forEach(c=>{
 c.style.display=c.dataset.name.toLowerCase().includes(q)?'block':'none';
 });
}
function watch(name){
 document.getElementById('message').textContent=
 name+' video will be added here soon.';
}
</script>
</body>
</html>
