
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil Toons Mania</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090d;color:white;font-family:Arial,sans-serif}
header{padding:20px 16px;background:#15151d;color:#e18aff;font-size:24px;font-weight:bold}
main{padding:16px;max-width:1000px;margin:auto}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#202027;color:white;font-size:16px}
h2{border-left:4px solid #d65bff;padding-left:10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#191922;border-radius:12px;overflow:hidden}
.poster{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:linear-gradient(140deg,#342050,#1b6c84);font-size:20px;font-weight:bold}
.card h3{padding:0 10px;font-size:16px}
button{margin:0 10px 14px;padding:10px 14px;background:#a83ee2;color:white;border:0;border-radius:8px}
footer{text-align:center;padding:20px;color:#aaa}
@media(min-width:650px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>▶ TAMIL TOONS MANIA</header>
<main>
<input id="search" placeholder="Search cartoons..." oninput="filterCards()">
<h2>🎬 Our Cartoons</h2>
<div class="cards" id="cards">
<div class="card" data-name="Chhota Bheem">

<div class="poster">
  <img
    src="./chhota-bheem.jpg"
    alt="Chhota Bheem"
    style="width:100%;height:100%;object-fit:cover;"
  >
</div>
 
<h3>Chhota Bheem</h3>
<button onclick="watch('Chhota Bheem')">▶ Watch</button>
</div>
<div class="card" data-name="Doraemon">

<div class="poster">
  <img src="./doraemon.jpg"
       alt="Doraemon"
       style="width:100%;height:100%;object-fit:cover;">
</div>
 
<h3>Doraemon</h3>
<button onclick="watch('Doraemon')">▶ Watch</button>
</div>
<div class="card" data-name="Jackie Chan">

<div class="poster">
  <img src="./jackie-chan.jpg"
       alt="Jackie Chan"
       style="width:100%;height:100%;object-fit:cover;">
</div>
<h3>Jackie Chan</h3>
<button onclick="watch('Jackie Chan')">▶ Watch</button>
</div>
<div class="card" data-name="Little singham">

<div class="poster">
  <img src="./little-singham.jpg"
       alt="Little Singham"
       style="width:100%;height:100%;object-fit:cover;">
</div>
<h3>Little Singham</h3>
<button onclick="watch('Little singham')">▶ Watch</button>
</div>
</div>
<p id="message"></p>
</main>
<footer>Tamil Toons Mania</footer>
<script>
function filterCards(){
 const q=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.card').forEach(c=>{
 c.style.display=c.dataset.name.toLowerCase().includes(q)?'block':'none';
 });
}
function watch(name){
 document.getElementById('message').textContent=
 name+' video will be added here soon.';
}
</script>
  <!-- Chhota Bheem Seasons --><section id="chhota-bheem-seasons" style="padding:20px;color:white;background:#202020;border-radius:12px;margin:20px 0;">
  <h2>Chhota Bheem - Tamil</h2>
  <p>Choose a Season</p>
  <div id="season-buttons" style="display:flex;flex-wrap:wrap;gap:8px;">
    <button onclick="showSeason(1)">Season 1</button>
    <button onclick="showSeason(2)">Season 2</button>
    <button onclick="showSeason(3)">Season 3</button>
    <button onclick="showSeason(4)">Season 4</button>
    <button onclick="showSeason(5)">Season 5</button>
    <button onclick="showSeason(6)">Season 6</button>
    <button onclick="showSeason(7)">Season 7</button>
    <button onclick="showSeason(8)">Season 8</button>
  </div>
  <div id="episode-list" style="margin-top:20px;"></div>
  <div id="episode-player" style="margin-top:16px;"></div>
</section><script>
function showSeason(season) {
  const list = document.getElementById("episode-list");
  const player = document.getElementById("episode-player");
  player.innerHTML = "";
  if (season === 3) {
    list.innerHTML = '<h3>Season 3 Episodes</h3><button onclick="playEpisode1()">Episode 1</button>';
  } else {
    list.innerHTML = '<p>Season ' + season + ' episodes will be added soon.</p>';
  }
}
function playEpisode1() {
document.getElementById("episode-player").innerHTML =
'<iframe width="100%" height="350" src="https://drive.google.com/file/d/10yW7HuDGxNFnYnTg-m1KCvhHUy41iHtf/preview" title="Chhota Bheem Episode 1" style="border:0;border-radius:12px" allowfullscreen></iframe>';
}
  document.getElementById("episode-player").innerHTML =
    '<iframe width="100%" height="250" src="https://www.youtube.com/embed/ry6E3Mhr7AQ" title="Chhota Bheem Season 3 Episode 1" style="border:0;border-radius:12px" allowfullscreen></iframe>';
}
</script>
</body>
</html>
